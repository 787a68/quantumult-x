name: Cleanup Release History

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Squash commits older than 6 months on release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin release 2>/dev/null || true

          # Exit if release branch doesn't exist
          if ! git show-ref --verify --quiet refs/remotes/origin/release; then
            echo "release branch does not exist, nothing to clean"
            exit 0
          fi

          git checkout -B release origin/release

          # Calculate cutoff date (6 months ago)
          cutoff_date=$(date -d "6 months ago" +%Y-%m-%d)
          echo "Cutoff date: $cutoff_date"

          # Find the last commit before the cutoff date
          cutoff_commit=$(git log release --before="$cutoff_date" -1 --format="%H")

          if [ -z "$cutoff_commit" ]; then
            echo "No commits older than 6 months, nothing to clean"
            exit 0
          fi

          echo "Last commit before cutoff: $cutoff_commit"
          commit_count_before=$(git rev-list --count release)
          echo "Total commits before cleanup: $commit_count_before"

          # Check if there are commits after the cutoff to rebase
          commits_after=$(git rev-list --count "$cutoff_commit"..release)

          # Create a new root commit with the tree at the cutoff point
          tree_at_cutoff=$(git rev-parse "$cutoff_commit^{tree}")
          new_root=$(git commit-tree "$tree_at_cutoff" -m "squashed history (before $cutoff_date)")

          if [ "$commits_after" -eq 0 ]; then
            # All commits are old, just reset to the new root
            git reset --hard "$new_root"
          else
            # Rebase all commits after cutoff onto the new root
            git rebase --onto "$new_root" "$cutoff_commit" release
          fi

          commit_count_after=$(git rev-list --count release)
          echo "Total commits after cleanup: $commit_count_after"

          git push origin release --force
          echo "Cleanup complete: squashed $((commit_count_before - commit_count_after)) old commits"