name: Generate Snippets

on:
  push:
    branches: [main]
  schedule:
    - cron: '6 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Build
        run: go build -o quantumult-x ./src

      - name: Run generator
        env:
          ACCEL_DOMAIN: ${{ vars.ACCEL_DOMAIN }}
        run: ./quantumult-x --conf-dir . --out-dir out

      - name: Commit and push to releases
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Fetch existing releases branch to compute line deltas
          git fetch origin releases 2>/dev/null || true

          # Build commit message with per-file line counts and deltas
          commit_msg="update snippets"
          for f in out/*.snippet; do
            name=$(basename "$f")
            count=$(wc -l < "$f")
            # Try to get old line count from releases branch
            old_count=$(git show origin/releases:"$name" 2>/dev/null | wc -l || echo "0")
            if [ "$old_count" -eq 0 ]; then
              delta="+$count"
            else
              diff=$((count - old_count))
              if [ "$diff" -ge 0 ]; then
                delta="+$diff"
              else
                delta="$diff"
              fi
            fi
            commit_msg="$commit_msg"$'\n'"$name: $count lines ($delta)"
          done

          # Checkout existing releases branch (only snippets), or create orphan if first run
          if git show-ref --verify --quiet refs/remotes/origin/releases; then
            git checkout -B releases origin/releases
          else
            git checkout --orphan releases
            git rm -rf . 2>/dev/null || true
          fi

          # Copy snippet files and commit
          cp out/*.snippet .
          git add *.snippet
          git commit -m "$commit_msg" || echo "no changes to commit"
          git push origin releases --force