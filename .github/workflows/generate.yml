name: Generate Snippets

on:
  push:
    branches: [main]
  schedule:
    - cron: '6 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Build
        run: go build -o quantumult-x ./src

      - name: Run generator
        env:
          ACCEL_DOMAIN: ${{ vars.ACCEL_DOMAIN }}
        run: ./quantumult-x --conf-dir . --out-dir out

      - name: Commit and push to releases
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B releases
          cp out/*.snippet .
          git add *.snippet || true
          lines=$(cat out/*.snippet | wc -l)
          git commit -m "update snippets (${lines} lines)" || echo "no changes to commit"
          git push origin releases --force