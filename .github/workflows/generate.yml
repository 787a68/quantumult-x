name: Generate Snippets

on:
  push:
    branches: [main]
  schedule:
    - cron: '6 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: false

      - name: Build
        run: go build -o quantumult-x ./src

      - name: Run generator
        env:
          ACCEL_DOMAIN: ${{ vars.ACCEL_DOMAIN }}
          POLICY_DIRECT: ${{ vars.POLICY_DIRECT }}
          POLICY_PROXY: ${{ vars.POLICY_PROXY }}
          POLICY_REJECT: ${{ vars.POLICY_REJECT }}
        run: ./quantumult-x --conf-dir . --out-dir out

      - name: Commit and push to release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Fetch existing release branch to compute line deltas
          git fetch origin release 2>/dev/null || true

          # Build commit message with per-file line counts and add/del deltas
          commit_msg="update snippets"
          for f in out/*.snippet; do
            name=$(basename "$f")
            count=$(wc -l < "$f")
            # Get old file from release branch for diff
            if git show-ref --verify --quiet refs/remotes/origin/release; then
              git show "origin/release:$name" > /tmp/old_snippet 2>/dev/null || true
            fi
            if [ ! -s /tmp/old_snippet ]; then
              added=$count
              removed=0
            else
              added=$(diff /tmp/old_snippet "$f" | grep -c '^>' || true)
              removed=$(diff /tmp/old_snippet "$f" | grep -c '^<' || true)
            fi
            rm -f /tmp/old_snippet
            commit_msg="$commit_msg"$'\n'"$name: $count lines (+$added $removed)"
          done

          # Checkout existing release branch (only snippets), or create orphan if first run
          if git show-ref --verify --quiet refs/remotes/origin/release; then
            git checkout -B release origin/release
          else
            git checkout --orphan release
            git rm -rf . 2>/dev/null || true
          fi

          # Copy snippet files and commit
          cp out/*.snippet .
          git add *.snippet
          git commit -m "$commit_msg" || echo "no changes to commit"
          git push origin release --force